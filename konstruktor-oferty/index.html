<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор оферты на цифровые продукты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Слева — условия, справа — собранная оферта постранично. Интерфейс в фирменном стиле,
   сам документ — строгий: Arial, только чёрный и серый. */
:root {
  color-scheme: light;
  --bg: #ffffff; --ink: #141414; --text: #262626; --grey: #8c8c8c;
  --rule: #141414; --line: #dcdcdc; --panel: #f4f4f4; --red: #e0261f;
  --field: #fafafa; --shell: #f0f0f0; --warn: #b26a00;
  --font: "Nunito Sans", "Proxima Nova", Arial, sans-serif;
  --doc: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --aside: 400px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--shell); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
p, h1, h2, h3, h4, ul, ol, dl { margin: 0; padding: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
b, strong { font-weight: 700; color: var(--ink); }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.app { display: grid; grid-template-columns: var(--aside) minmax(0, 1fr); height: 100%; }

/* ——— панель ——— */
.aside { background: var(--bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 20px 24px 14px; }
.brand-name { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; color: var(--ink); }
.brand-sub { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--grey); margin-top: 2px; }
.tabs { display: flex; gap: 20px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 0 0 10px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--grey); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--red); }
.tab.active { color: var(--red); border-bottom-color: var(--red); }
.tab .badge { display: inline-block; min-width: 17px; padding: 0 4px; margin-left: 5px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; line-height: 17px; text-align: center; border-radius: 9px; }
.tab .badge.zero { background: var(--grey); }
.pane { flex: 1 1 auto; overflow-y: auto; padding: 18px 24px 28px; min-height: 0; }
.pane[hidden] { display: none; }

.group { border-bottom: 1px solid var(--line); }
.group-head { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 14px 0; cursor: pointer; text-align: left; }
.group-num { flex: none; width: 22px; font-size: 12px; font-weight: 800; color: var(--red); font-variant-numeric: tabular-nums; }
.group-t { flex: 1 1 auto; min-width: 0; font-size: 14.5px; font-weight: 700; color: var(--ink); }
.group-m { display: block; font-size: 12px; font-weight: 400; color: var(--grey); margin-top: 2px; }
.chev { flex: none; width: 10px; height: 10px; border-right: 1.5px solid var(--grey); border-bottom: 1.5px solid var(--grey); transform: rotate(45deg); margin-right: 4px; transition: transform .15s; }
.group.open .chev { transform: rotate(-135deg); }
.group-body { padding: 2px 0 18px 32px; }
.group-body[hidden] { display: none; }

.f { margin-top: 14px; }
.f:first-child { margin-top: 0; }
.f > label, .f > .flabel { display: block; font-size: 13px; color: var(--grey); margin-bottom: 5px; }
.f .hint { font-size: 12px; color: var(--grey); margin-top: 5px; line-height: 1.4; }
.inp, .ta, .sel { width: 100%; background: var(--field); border: 1px solid var(--line); padding: 9px 11px; font-size: 14px; }
.inp:focus, .ta:focus, .sel:focus { border-color: var(--ink); outline: none; background: var(--bg); }
.inp.empty { border-color: var(--red); background: #fff; }
.ta { resize: vertical; min-height: 70px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ck { display: flex; align-items: flex-start; gap: 9px; padding: 8px 10px; border: 1px solid var(--line); margin-top: 7px; cursor: pointer; background: var(--bg); }
.ck:hover { border-color: var(--ink); }
.ck.on { border-color: var(--ink); }
.ck input[type="checkbox"], .ck input[type="radio"] { margin: 2px 0 0; accent-color: var(--red); width: 15px; height: 15px; flex: none; }
.ck .ct { flex: 1 1 auto; min-width: 0; font-size: 13.5px; line-height: 1.35; }
.ck .cm { display: block; font-size: 12px; color: var(--grey); margin-top: 2px; line-height: 1.4; }

/* ——— проверка ——— */
.risk { border-top: 1px solid var(--line); padding: 14px 0; }
.risk:first-child { border-top: 0; }
.risk-h { display: flex; align-items: baseline; gap: 9px; }
.risk-lvl { flex: none; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
.risk.high .risk-lvl { color: var(--red); }
.risk.medium .risk-lvl { color: var(--warn); }
.risk.info .risk-lvl { color: var(--grey); }
.risk-t { font-weight: 700; color: var(--ink); font-size: 14px; line-height: 1.35; }
.risk p { font-size: 13px; line-height: 1.5; margin-top: 7px; }
.risk .fix { color: var(--ink); }
.risk .norm { color: var(--grey); font-size: 12.5px; margin-top: 6px; }
.ok { background: var(--panel); padding: 14px 16px; font-size: 13.5px; }
.ph-list { margin-top: 10px; padding-left: 18px; list-style: disc; }
.ph-list li { font-size: 13px; line-height: 1.5; color: var(--text); }

.foot { flex: none; border-top: 1px solid var(--line); padding: 13px 24px 16px; background: var(--bg); }
.btns { display: flex; gap: 8px; }
.btn { flex: 1 1 auto; white-space: nowrap; padding: 10px 8px; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); font-size: 13px; font-weight: 700; cursor: pointer; }
.btn:hover { border-color: var(--red); color: var(--red); }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
.links { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
.linkbtn { background: none; border: 0; padding: 0; cursor: pointer; font-size: 12.5px; color: var(--grey); text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:hover { color: var(--red); }
.status { font-size: 12px; color: var(--grey); margin-top: 9px; }
.status b { color: var(--red); }

/* ——— документ ——— */
.main { overflow-y: auto; min-height: 0; padding: 26px 0 56px; }
.stage { zoom: var(--zoom, 1); display: flex; flex-direction: column; align-items: center; gap: 22px; }
.sheet { width: 210mm; height: 297mm; background: #fff; padding: 20mm 18mm; position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.14), 0 10px 28px rgba(0,0,0,.08); overflow: hidden; }
.sheet-body { height: 100%; }
.sheet-no { position: absolute; left: 18mm; right: 18mm; bottom: 10mm; text-align: center; font-family: var(--doc); font-size: 9pt; color: #8c8c8c; }

.doc { font-family: var(--doc); font-size: 10.5pt; line-height: 1.45; color: #262626; }
.doc .dt { text-align: center; font-weight: 700; font-size: 14pt; color: #141414; line-height: 1.3; }
.doc .ds { text-align: center; font-size: 10.5pt; color: #262626; margin-top: 6pt; line-height: 1.4; }
.doc .dm { text-align: center; font-size: 9.5pt; color: #8c8c8c; margin-top: 10pt; }
.doc .drule { border-bottom: 1px solid #141414; margin-top: 14pt; }
.doc h2 { font-size: 11pt; font-weight: 700; color: #141414; text-transform: uppercase; letter-spacing: 0.02em; margin-top: 16pt; margin-bottom: 7pt; line-height: 1.3; }
.doc h2 .hn { color: #8c8c8c; margin-right: 8px; }
.doc .cl { display: flex; margin-top: 7pt; text-align: justify; }
.doc .cl .n { flex: 0 0 13mm; color: #8c8c8c; font-variant-numeric: tabular-nums; }
.doc .cl .b { flex: 1 1 auto; min-width: 0; hyphens: auto; -webkit-hyphens: auto; }
.doc .sl { margin-top: 4pt; }
.doc .sl .li { display: flex; margin-top: 3pt; text-align: justify; }
.doc .sl .li .m { flex: 0 0 7mm; color: #8c8c8c; }
.doc .sl .li .x { flex: 1 1 auto; min-width: 0; hyphens: auto; -webkit-hyphens: auto; }
.doc .rq { margin-top: 5pt; display: flex; }
.doc .rq .k { flex: 0 0 48mm; color: #8c8c8c; }
.doc .rq .v { flex: 1 1 auto; min-width: 0; color: #141414; font-weight: 700; }
.ph { color: #e0261f; border-bottom: 1px dotted #e0261f; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 13.5px; font-weight: 600; padding: 10px 18px; z-index: 50; }
.toast[hidden] { display: none; }

@media (max-width: 1150px) { :root { --aside: 340px; } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  body { height: auto; }
  .aside { border-right: 0; border-bottom: 1px solid var(--line); }
  .pane { overflow: visible; }
  .main { padding: 18px 12px 40px; }
}

@media print {
  @page { size: A4; margin: 0; }
  body { background: #fff; height: auto; }
  .app { display: block; height: auto; }
  .aside, .toast { display: none !important; }
  .main { overflow: visible; padding: 0; }
  .stage { zoom: 1; display: block; gap: 0; }
  .sheet { box-shadow: none; break-after: page; }
  .sheet:last-child { break-after: auto; }
  .ph { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="aside">
    <div class="brand">
      <p class="brand-name">Конструктор оферты</p>
      <p class="brand-sub">Цифровые продукты · РФ</p>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" id="tab-form" type="button" role="tab" aria-selected="true" aria-controls="pane-form">Условия</button>
      <button class="tab" id="tab-check" type="button" role="tab" aria-selected="false" aria-controls="pane-check">Проверка<span class="badge zero" id="badge">0</span></button>
    </div>
    <div class="pane" id="pane-form" role="tabpanel" aria-labelledby="tab-form"></div>
    <div class="pane" id="pane-check" role="tabpanel" aria-labelledby="tab-check" hidden></div>
    <div class="foot">
      <div class="btns">
        <button class="btn primary" id="btn-pdf" type="button">Скачать PDF</button>
        <button class="btn" id="btn-word" type="button">Скачать Word</button>
      </div>
      <div class="links">
        <button class="linkbtn" id="btn-export" type="button">Сохранить настройки</button>
        <button class="linkbtn" id="btn-import" type="button">Загрузить настройки</button>
        <button class="linkbtn" id="btn-reset" type="button">Сбросить всё</button>
      </div>
      <p class="status" id="status"></p>
      <input type="file" id="file-import" accept="application/json,.json" hidden>
    </div>
  </aside>

  <main class="main" id="main"><div class="stage" id="stage"></div></main>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<script>
/* ====================================================================
   Движок оферты: конфигурация по умолчанию, сборка текста, проверка рисков.
   Текст собирается из блоков, нумерация расставляется автоматически.
   ==================================================================== */

var PH = function (label) { return '{{ph:' + label + '}}'; };

function defaults() {
  var d = new Date();
  return {
    org: {
      type: 'ip', name: '', short: '', inn: '', ogrn: '', kpp: '',
      address: '', email: '', phone: '', site: '', director: '',
      hasEduLicense: false, eduLicenseNo: ''
    },
    tax: 'usn',
    product: { kind: 'record', nature: 'license', name: '', b2b: false, adultsOnly: false },
    access: {
      platforms: ['getcourse'], term: 'days', days: 365, date: '', periodName: 'календарный месяц',
      deadlineHours: 24, download: false
    },
    support: { chat: false, chatPlatform: 'Telegram', curator: false, answerDays: 3, calls: false, recordCalls: false },
    pay: { methods: ['acquiring'], recurrent: false, promo: true, thirdParty: true, installment: false },
    refund: { model: 'consumer', guaranteeDays: 14, reviewDays: 10, payDays: 10, deductFees: false, proportional: true },
    ip: { usePenalty: true, penaltyTransfer: 2, penaltyPublish: 10, useCompensation: true, banAI: true },
    disc: {
      marketingTerms: true, noResult: true, notEducational: true,
      notMedical: false, notFinancial: false, notLegal: false, notPsych: false
    },
    dispute: { claimDays: 10, b2bJurisdiction: false },
    pd: { policyUrl: '', mailing: true },
    meta: { version: d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()) }
  };
}
function two(n) { return (n < 10 ? '0' : '') + n; }

/* ——— словари ——— */
var KINDS = {
  record: 'Курс, интенсив или марафон в записи',
  live: 'Курс с обратной связью, куратором или созвонами',
  club: 'Клуб или сообщество по подписке',
  file: 'Гайд, чек-лист, шаблон — файл сразу после оплаты',
  software: 'Программа, бот, скрипт, шаблон в сервисе',
  consult: 'Личная консультация или разбор'
};
var NATURES = {
  license: 'Лицензионный договор — вы даёте право пользоваться материалами',
  services: 'Договор возмездного оказания услуг — вы лично работаете с человеком',
  mixed: 'Смешанный договор — материалы плюс работа куратора',
  subscription: 'Абонентский договор — плата за период доступа'
};
var NATURE_DEFAULT = {
  record: 'license', live: 'mixed', club: 'subscription',
  file: 'license', software: 'license', consult: 'services'
};
var PLATFORMS = {
  getcourse: 'образовательная платформа GetCourse',
  telegram: 'мессенджер Telegram (закрытый канал, чат или бот)',
  email: 'электронная почта — направление файлов или ссылок',
  site: 'личный кабинет на Сайте',
  video: 'видеохостинг с доступом по ссылке',
  zoom: 'сервис видеоконференций'
};
var PAYS = {
  acquiring: 'банковской картой через платёжный сервис',
  sbp: 'через Систему быстрых платежей',
  wallet: 'через электронные кошельки и платёжные агрегаторы',
  invoice: 'по счёту в безналичном порядке (для юридических лиц и индивидуальных предпринимателей)',
  installment: 'в рассрочку или в кредит через банк-партнёр'
};
var TAXES = {
  usn: 'не облагается налогом на добавленную стоимость в связи с применением Исполнителем упрощённой системы налогообложения',
  npd: 'не облагается налогом на добавленную стоимость в связи с применением Исполнителем специального налогового режима «Налог на профессиональный доход»',
  nds5: 'включает налог на добавленную стоимость по ставке 5%',
  nds7: 'включает налог на добавленную стоимость по ставке 7%',
  nds20: 'включает налог на добавленную стоимость по ставке 20%'
};

/* ——— вспомогательные формулировки ——— */
function orgName(c) { return c.org.name || PH('полное наименование Исполнителя'); }
function orgShort(c) { return c.org.short || c.org.name || PH('краткое наименование'); }
function siteUrl(c) { return c.org.site || PH('адрес сайта'); }
function productWord(c) {
  return c.product.kind === 'consult' ? 'Консультация' : 'Продукт';
}
function platformList(c) {
  var sel = c.access.platforms.filter(function (p) { return PLATFORMS[p]; });
  if (!sel.length) return [PH('укажите платформу выдачи доступа')];
  return sel.map(function (p) { return PLATFORMS[p]; });
}
function accessTermText(c) {
  var a = c.access;
  if (a.term === 'forever') return 'без ограничения срока — в течение всего времени, пока Исполнитель поддерживает соответствующую Платформу';
  if (a.term === 'days') return 'в течение ' + (a.days || PH('N')) + ' календарных дней с момента предоставления доступа';
  if (a.term === 'date') return 'до ' + (a.date ? ruDateFull(a.date) : PH('дата окончания доступа')) + ' включительно';
  return 'в течение оплаченного периода (' + (a.periodName || 'календарный месяц') + ')';
}
function ruDateFull(iso) {
  var M = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var p = String(iso || '').split('-');
  if (p.length !== 3) return '';
  return Number(p[2]) + ' ' + M[Number(p[1]) - 1] + ' ' + p[0] + ' г.';
}

/* ====================================================================
   Сборка документа
   ==================================================================== */
function buildDocument(c) {
  var S = [];
  function sec(id, title) { var s = { id: id, title: title, items: [] }; S.push(s); return s; }
  function p(s, text, opts) {
    var it = { text: text };
    if (opts) { if (opts.id) it.id = opts.id; if (opts.list) it.list = opts.list; if (opts.listStyle) it.listStyle = opts.listStyle; if (opts.sub) it.sub = opts.sub; }
    s.items.push(it);
    return it;
  }

  var isLicense = c.product.nature === 'license';
  var isServices = c.product.nature === 'services';
  var isMixed = c.product.nature === 'mixed';
  var isSub = c.product.nature === 'subscription';
  var hasLicense = isLicense || isMixed || isSub;
  var hasServices = isServices || isMixed;
  var P = productWord(c);
  var feeWord = hasLicense && !hasServices ? 'лицензионного вознаграждения' : 'оплаты';

  /* —— 1. Термины —— */
  var t = sec('terms', 'Термины и определения');
  p(t, 'Сайт — сайт в сети «Интернет» по адресу ' + siteUrl(c) + ', а также все его страницы и поддомены, администрируемые Исполнителем.');
  p(t, 'Исполнитель — ' + orgName(c) + ', размещающий настоящую оферту и предоставляющий ' + (hasLicense ? 'доступ к Продукту и права использования Материалов' : 'предусмотренные офертой услуги') + '.');
  p(t, 'Заказчик — лицо, совершившее акцепт настоящей оферты в порядке, предусмотренном разделом {{sec:general}} настоящей оферты.');
  p(t, 'Продукт — цифровой продукт Исполнителя, предлагаемый к приобретению на Сайте: ' +
    (c.product.name ? c.product.name : 'совокупность Материалов и (или) услуг, состав которых определяется Страницей продукта') + '.');
  p(t, 'Материалы — все элементы Продукта в цифровой форме: видеозаписи, аудиозаписи, тексты, изображения, презентации, гайды, чек-листы, шаблоны, задания, методические и справочные материалы, структура и последовательность изложения, а также любые обновления и дополнения к ним.');
  p(t, 'Платформа — техническая среда, через которую Заказчику предоставляется доступ к Материалам: ' + platformList(c).join('; ') + '.');
  p(t, 'Доступ — предоставление Заказчику технической возможности ознакомления с Материалами в объёме приобретённого Продукта.');
  p(t, 'Страница продукта — страница Сайта с описанием конкретного Продукта или тарифа, его состава, цены, срока доступа, Платформы и иных условий. Страница продукта является неотъемлемой частью настоящей оферты.');
  if (c.support.chat) p(t, 'Чат — закрытый групповой чат или канал в ' + (c.support.chatPlatform || 'мессенджере') + ', доступ к которому предоставляется участникам Продукта, если это предусмотрено Страницей продукта.');
  p(t, 'Личный кабинет — раздел Платформы, доступ к которому предоставляется Заказчику по логину и паролю либо по персональной ссылке.');

  /* —— 2. Общие положения —— */

/* ====================================================================
   Нумерация и ссылки
   ==================================================================== */
function numberDocument(sections) {
  var refs = {}, secRefs = {};
  sections.forEach(function (s, si) {
    s.n = String(si + 1);
    secRefs[s.id] = s.n;
    s.items.forEach(function (it, ii) {
      it.n = s.n + '.' + (ii + 1);
      if (it.id) refs[it.id] = it.n;
      if (it.sub) it.sub.forEach(function (su, k) { su.n = it.n + '.' + (k + 1); });
    });
  });
  var resolve = function (txt) {
    return String(txt)
      .replace(/\{\{ref:([a-zA-Z]+)\}\}/g, function (m, id) { return refs[id] || '—'; })
      .replace(/\{\{sec:([a-zA-Z]+)\}\}/g, function (m, id) { return secRefs[id] || '—'; });
  };
  sections.forEach(function (s) {
    s.items.forEach(function (it) {
      it.text = resolve(it.text);
      if (it.list) it.list = it.list.map(resolve);
      if (it.sub) it.sub.forEach(function (su) { su.text = resolve(su.text); });
    });
  });
  return sections;
}

      var scan = [it.text].concat(it.list || []);
      scan.forEach(function (txt) {
        var m = String(txt).match(/\{\{ph:([^}]+)\}\}/g) || [];

          var label = x.slice(5, -2);
          if (set.indexOf(label) === -1) set.push(label);
        });
      });
    });
  });
  return set;

  function renderForm() {

  function renderField(f) {
    var v = get(f.k);
    if (f.type === 'ck') {
      return '<label class="ck' + (v ? ' on' : '') + '"><input type="checkbox" data-k="' + f.k + '"' + (v ? ' checked' : '') + '>' +
        '<span class="ct">' + esc(f.t) + (f.cm ? '<span class="cm">' + esc(f.cm) + '</span>' : '') + '</span></label>';
    }
    if (f.type === 'radio') {
      return '<div class="f"><span class="flabel">' + esc(f.t) + '</span>' +
        f.opts.map(function (o) {
          return '<label class="ck' + (v === o[0] ? ' on' : '') + '"><input type="radio" name="' + f.k.replace(/\./g, '_') + '" data-k="' + f.k + '" value="' + o[0] + '"' + (v === o[0] ? ' checked' : '') + '>' +
            '<span class="ct">' + esc(o[1]) + '</span></label>';
        }).join('') +
        (f.hint ? '<p class="hint">' + esc(f.hint) + '</p>' : '') + '</div>';
    }
    if (f.type === 'multi') {
      var arr = v || [];
      return '<div class="f"><span class="flabel">' + esc(f.t) + '</span>' +
        f.opts.map(function (o) {
          var on = arr.indexOf(o[0]) !== -1;
          return '<label class="ck' + (on ? ' on' : '') + '"><input type="checkbox" data-multi="' + f.k + '" value="' + o[0] + '"' + (on ? ' checked' : '') + '>' +
            '<span class="ct">' + esc(o[1]) + '</span></label>';
        }).join('') + '</div>';
    }
    if (f.type === 'sel') {
      return '<div class="f"><label for="x-' + f.k + '">' + esc(f.t) + '</label>' +
        '<select class="sel" id="x-' + f.k + '" data-k="' + f.k + '">' +
        f.opts.map(function (o) { return '<option value="' + o[0] + '"' + (v === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') +
        '</select>' + (f.hint ? '<p class="hint">' + esc(f.hint) + '</p>' : '') + '</div>';
    }
    var type = f.type === 'num' ? 'number' : f.type === 'date' ? 'date' : 'text';
    var empty = f.req && !String(v || '').trim();
    return '<div class="f"><label for="x-' + f.k + '">' + esc(f.t) + (f.req ? ' *' : '') + '</label>' +
      '<input class="inp' + (empty ? ' empty' : '') + '" id="x-' + f.k + '" type="' + type + '" data-k="' + f.k + '"' +
      ' value="' + esc(v == null ? '' : v) + '"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + '>' +
      (f.hint ? '<p class="hint">' + esc(f.hint) + '</p>' : '') + '</div>';
  }

  function buildBlocks(sections) {
    var b = [];
    function push(html, kind) { var d = el('div'); d.innerHTML = html; var n = d.firstElementChild; if (kind) n.setAttribute('data-kind', kind); b.push(n); }

    push('<div><p class="dt">ПУБЛИЧНАЯ ОФЕРТА</p>' +
      '<p class="ds">' + phHtml(docTitle(cfg)) + '</p>' +
      '<p class="dm">Сайт: ' + phHtml(cfg.org.site || '{{ph:адрес сайта}}') + '</p>' +
      '<p class="dm">Редакция от ' + (cfg.meta.version ? ruDateFull(cfg.meta.version) : '{{ph:дата редакции}}') + '</p>' +
      '<div class="drule"></div></div>', 'head');

    sections.forEach(function (s) {
      push('<h2><span class="hn">' + s.n + '.</span>' + esc(s.title) + '</h2>', 'h');
      if (s.requisites) { requisiteBlocks().forEach(function (n) { b.push(n); }); return; }
      s.items.forEach(function (it) {
        var html = '<div class="cl"><span class="n">' + it.n + '.</span><span class="b">' + phHtml(it.text) + '</span></div>';
        push(html);
        if (it.list) {
          var letters = 'абвгдежзийклмноп'.split('');
          var inner = it.list.map(function (x, i) {
            var mark = it.listStyle === 'letters' ? letters[i] + ')' : '—';
            return '<div class="li"><span class="m">' + mark + '</span><span class="x">' + phHtml(x) + '</span></div>';
          }).join('');
          push('<div class="sl">' + inner + '</div>');
        }
      });
    });
    return b;
  }

  function paginate(blocks) {
    var stage = $('#stage');
    stage.innerHTML = '';
    var sheets = [];
    function newSheet() {
      var s = el('div', 'sheet');
      var body = el('div', 'sheet-body doc');
      var no = el('div', 'sheet-no');
      s.appendChild(body); s.appendChild(no); stage.appendChild(s);
      var o = { s: s, body: body, no: no };
      sheets.push(o); return o;
    }
    var cur = newSheet();
    blocks.forEach(function (node) {
      cur.body.appendChild(node);
      var bb = cur.body.getBoundingClientRect(), nb = node.getBoundingClientRect();
      if (nb.bottom > bb.bottom + 0.5 && cur.body.children.length > 1) {
        cur.body.removeChild(node);
        cur = newSheet();
        cur.body.appendChild(node);
      }
    });
    // заголовок не должен оставаться последней строкой страницы
    for (var i = 0; i < sheets.length - 1; i++) {
      var body = sheets[i].body, last = body.lastElementChild;
      if (last && last.getAttribute('data-kind') === 'h') {
        body.removeChild(last);
        sheets[i + 1].body.insertBefore(last, sheets[i + 1].body.firstChild);
      }
    }
    sheets.forEach(function (o, i) { o.no.textContent = (i + 1) + ' / ' + sheets.length; });
    return sheets.length;
  }

  function fit() {
    var w = $('#main').clientWidth;
    var sheetPx = 210 / 25.4 * 96;
    var z = Math.min(1, Math.max(0.3, (w - 52) / sheetPx));
    $('#stage').style.setProperty('--zoom', z.toFixed(3));
  }

  /* ================= проверка ================= */
  var LEVELS = { high: 'Высокий риск', medium: 'Средний риск', info: 'На заметку' };

    var html = '';

      html += '<div class="risk high"><div class="risk-h"><span class="risk-lvl">Заполнить</span>' +
        '<span class="risk-t">Незаполненные поля — ' + phs.length + '</span></div>' +
        '<p>В тексте оферты они отмечены красным в квадратных скобках. Пока они не заполнены, документ отправлять нельзя:</p>' +
        '<ul class="ph-list circ">' + phs.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
    }
    if (!risks.length && !phs.length) {
      html = '<div class="ok">Критичных замечаний нет. Перед публикацией проверьте, что описание продукта на сайте совпадает с тем, что собрано здесь: состав, цена, срок доступа и условия возврата.</div>';
    }
    html += risks.map(function (r) {
      return '<div class="risk ' + r.level + '">' +
        '<div class="risk-h"><span class="risk-lvl">' + LEVELS[r.level] + '</span><span class="risk-t">' + esc(r.title) + '</span></div>' +
        '<p>' + esc(r.what) + '</p>' +
        '<p class="fix"><b>Что сделать.</b> ' + esc(r.fix) + '</p>' +
        '<p class="norm">' + esc(r.norm) + '</p></div>';
    }).join('');
    html += '<div class="risk info"><div class="risk-h"><span class="risk-lvl">Важно</span>' +
      '<span class="risk-t">Что конструктор не делает за вас</span></div>' +
      '<p>Он собирает договор по праву Российской Федерации для продаж физическим лицам и бизнесу внутри страны. ' +
      'Продажи за рубеж, расчёты в валюте, работа с несовершеннолетними, маркетплейсы и агентские схемы требуют отдельных условий.</p>' +
      '<p>Нормы и судебная практика меняются: перед публикацией сверьте редакции законов, а при изменении вашего продукта соберите оферту заново и обновите дату редакции.</p>' +

    $('#pane-check').innerHTML = html;

  /* ================= общий рендер ================= */
  var lastSections = null;

    renderForm();
    var sections = numberDocument(buildDocument(cfg));
    lastSections = sections;
    paginate(buildBlocks(sections));
    fit();
    var risks = checkRisks(cfg);
    var phs = domPlaceholders();
    renderCheck(risks, phs);
    var high = risks.filter(function (r) { return r.level === 'high'; }).length;
    var n = high + phs.length;
    var badge = $('#badge');
    badge.textContent = n;
    badge.className = 'badge' + (n ? '' : ' zero');
    $('#status').innerHTML = phs.length
      ? 'Не заполнено полей: <b>' + phs.length + '</b> · замечаний: ' + risks.length
      : 'Все поля заполнены · замечаний: ' + risks.length;

  /* ================= события ================= */
  $('#pane-form').addEventListener('click', function (e) {
    var b = e.target.closest('[data-g]');
    if (!b) return;
    var id = b.getAttribute('data-g');
    openGroups[id] = !openGroups[id];
    renderForm();
  });

  $('#pane-form').addEventListener('change', function (e) {
    var t = e.target;
    var multi = t.getAttribute('data-multi');
    if (multi) {
      var arr = (get(multi) || []).slice();
      var i = arr.indexOf(t.value);
      if (t.checked && i === -1) arr.push(t.value);
      if (!t.checked && i !== -1) arr.splice(i, 1);
      set(multi, arr);
      render();
      return;
    }
    var k = t.getAttribute('data-k');
    if (!k) return;
    if (t.type === 'checkbox') set(k, t.checked);
    else if (t.type === 'radio') set(k, t.value);
    else if (t.type === 'number') set(k, Number(t.value) || 0);
    else set(k, t.value);
    if (k === 'product.kind') cfg.product.nature = NATURE_DEFAULT[cfg.product.kind] || 'license';
    if (k === 'access.term' && cfg.access.term === 'period') cfg.product.nature = 'subscription';
    render();
  });

  var typeTimer;
  $('#pane-form').addEventListener('input', function (e) {
    var t = e.target;
    if (t.tagName !== 'INPUT' || t.type === 'checkbox' || t.type === 'radio') return;
    var k = t.getAttribute('data-k');
    if (!k) return;
    set(k, t.type === 'number' ? (Number(t.value) || 0) : t.value);
    clearTimeout(typeTimer);
    typeTimer = setTimeout(function () {
      var sections = numberDocument(buildDocument(cfg));
      lastSections = sections;
      paginate(buildBlocks(sections));
      fit();
      var risks = checkRisks(cfg), phs = domPlaceholders();

  function translit(str) {
    var M = { а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z', и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'c', ч: 'ch', ш: 'sh', щ: 'sch', ъ: '', ы: 'y', ь: '', э: 'e', ю: 'yu', я: 'ya' };
    return String(str).toLowerCase().split('').map(function (ch) {
      if (M[ch] !== undefined) return M[ch];
      return /[a-z0-9]/.test(ch) ? ch : '-';
    }).join('').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
  }
  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }

    var css = [
      'body{font-family:Arial,sans-serif;font-size:11pt;line-height:1.45;color:#262626;}',
      'p{margin:0 0 7pt;text-align:justify;}',
      '.dt{text-align:center;font-weight:bold;font-size:14pt;color:#141414;}',
      '.ds{text-align:center;font-size:11pt;}',
      '.dm{text-align:center;font-size:10pt;color:#8c8c8c;}',
      'h2{font-size:11.5pt;font-weight:bold;color:#141414;text-transform:uppercase;margin:16pt 0 7pt;}',
      'table{width:100%;border-collapse:collapse;}',
      'td.n{width:14mm;color:#8c8c8c;vertical-align:top;padding:0 0 7pt;}',
      'td.b{vertical-align:top;padding:0 0 7pt;text-align:justify;}',
      'td.m{width:8mm;color:#8c8c8c;vertical-align:top;padding:0 0 4pt;}',
      'td.x{vertical-align:top;padding:0 0 4pt;text-align:justify;}',
      'td.k{width:50mm;color:#8c8c8c;vertical-align:top;padding:0 0 4pt;}',
      'td.v{vertical-align:top;padding:0 0 4pt;font-weight:bold;color:#141414;}',
      '.ph{color:#e0261f;}'
    ].join('');

    var body = '<p class="dt">ПУБЛИЧНАЯ ОФЕРТА</p><p class="ds">' + phHtml(docTitle(cfg)) + '</p>' +
      '<p class="dm">Сайт: ' + phHtml(cfg.org.site || '{{ph:адрес сайта}}') + '</p>' +
      '<p class="dm">Редакция от ' + (cfg.meta.version ? ruDateFull(cfg.meta.version) : '[дата редакции]') + '</p>';

    sections.forEach(function (s) {
      body += '<h2>' + s.n + '. ' + esc(s.title) + '</h2>';
      if (s.requisites) {
        body += '<table>' + requisiteRows().map(function (r) {
          return '<tr><td class="k">' + esc(r[0]) + '</td><td class="v">' + phHtml(r[1]) + '</td></tr>';
        }).join('') + '</table>';
        return;
      }
      s.items.forEach(function (it) {
        body += '<table><tr><td class="n">' + it.n + '.</td><td class="b">' + phHtml(it.text) + '</td></tr></table>';
        if (it.list) {
          var letters = 'абвгдежзийклмноп'.split('');
          body += '<table>' + it.list.map(function (x, i) {
            var mark = it.listStyle === 'letters' ? letters[i] + ')' : '—';
            return '<tr><td class="n"></td><td class="m">' + mark + '</td><td class="x">' + phHtml(x) + '</td></tr>';
          }).join('') + '</table>';
        }
      });
    });

    var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
      '<head><meta charset="utf-8"><title>Публичная оферта</title>' +
      '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->' +
      '<style>@page{size:A4;margin:20mm 18mm;}' + css + '</style></head><body>' + body + '</body></html>';

    download(new Blob(['﻿', html], { type: 'application/msword;charset=utf-8' }),
      'oferta-' + (cfg.org.short || cfg.org.name ? translit(cfg.org.short || cfg.org.name) + '-' : '') + (cfg.meta.version || '') + '.doc');
    toast('Файл Word скачан');
  });

  function requisiteRows() {
    var o = cfg.org, rows = [];
    rows.push(['Наименование', o.name || '{{ph:полное наименование}}']);
    if (o.type === 'ooo' && o.director) rows.push(['В лице', o.director]);
    rows.push(['ИНН', o.inn || '{{ph:ИНН}}']);
    rows.push([o.type === 'ooo' ? 'ОГРН' : 'ОГРНИП', o.ogrn || '{{ph:ОГРН}}']);
    if (o.type === 'ooo') rows.push(['КПП', o.kpp || '{{ph:КПП}}']);
    rows.push(['Адрес', o.address || '{{ph:адрес}}']);
    rows.push(['Электронная почта', o.email || '{{ph:электронная почта}}']);
    if (o.phone) rows.push(['Телефон', o.phone]);
    rows.push(['Сайт', o.site || '{{ph:адрес сайта}}']);
    return rows;
  }

  $('#btn-export').addEventListener('click', function () {
    download(new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' }),
      'oferta-nastroyki-' + (cfg.meta.version || '') + '.json');
    toast('Настройки сохранены в файл');
  });
  $('#btn-import').addEventListener('click', function () { $('#file-import').click(); });
  $('#file-import').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        cfg = deepMerge(defaults(), JSON.parse(rd.result));
        render();
        toast('Настройки загружены');
      } catch (err) { toast('Файл не читается'); }
      e.target.value = '';
    };
    rd.readAsText(f);
  });
  $('#btn-reset').addEventListener('click', function () {
    cfg = defaults();
    openGroups = { org: true };
    render();
    toast('Всё сброшено');
  });

  var toastTimer;
  function toast(m) {
    var t = $('#toast');
    t.textContent = m; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
  }

  window.addEventListener('resize', fit);
  document.fonts && document.fonts.ready && document.fonts.ready.then(function () { render(); });
  render();
})();

</script>
</body>
</html>
