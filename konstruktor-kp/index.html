<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор КП — Яна Горкунова</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Конструктор коммерческих предложений. Слева — сборка, справа — живое превью листов A4. */
:root {
  color-scheme: light;
  --bg: #ffffff; --ink: #141414; --text: #262626; --grey: #8c8c8c;
  --rule: #141414; --line: #dcdcdc; --panel: #f4f4f4; --red: #e0261f;
  --field: #fafafa; --shell: #f0f0f0;
  --font: "Nunito Sans", "Proxima Nova", Arial, sans-serif;
  --aside: 384px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--shell); color: var(--text);
  font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
p, h1, h2, h3, h4, ul, ol, dl, figure { margin: 0; padding: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
b, strong { font-weight: 700; color: var(--ink); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* ——— каркас ——— */
.app { display: grid; grid-template-columns: var(--aside) minmax(0, 1fr); height: 100%; }

/* ——— левая панель ——— */
.aside { background: var(--bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 22px 24px 16px; }
.brand-name { font-weight: 800; font-size: 19px; letter-spacing: -0.02em; color: var(--ink); }
.brand-sub { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--grey); margin-top: 2px; }
.tabs { display: flex; gap: 20px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 0 0 10px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--grey); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--red); }
.tab.active { color: var(--red); border-bottom-color: var(--red); }
.pane { flex: 1 1 auto; overflow-y: auto; padding: 20px 24px 28px; min-height: 0; }
.pane[hidden] { display: none; }

.group { margin-top: 26px; }
.group:first-child { margin-top: 0; }
.group-title { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--grey); padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
.field { margin-top: 14px; }
.field > label { display: block; font-size: 13px; color: var(--grey); margin-bottom: 5px; }
.inp, .ta, .sel { width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 0; padding: 9px 11px; font-size: 14px; }
.inp:focus, .ta:focus, .sel:focus { border-color: var(--ink); outline: none; background: var(--bg); }
.ta { resize: vertical; min-height: 78px; line-height: 1.45; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.linkbtn { background: none; border: 0; padding: 0; margin-top: 6px; cursor: pointer; font-size: 13px; color: var(--grey); text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:hover { color: var(--red); }

/* строка с чекбоксом */
.check { display: flex; align-items: flex-start; gap: 10px; padding: 9px 11px; border: 1px solid var(--line); margin-top: 8px; cursor: pointer; background: var(--bg); }
.check:hover { border-color: var(--ink); }
.check input[type="checkbox"] { margin: 2px 0 0; accent-color: var(--red); width: 15px; height: 15px; flex: none; }
.check .ct { flex: 1 1 auto; min-width: 0; font-size: 14px; line-height: 1.35; }
.check.on { border-color: var(--ink); }

.srv { border: 1px solid var(--line); margin-top: 8px; background: var(--bg); }
.srv.on { border-color: var(--ink); }
.srv-head { display: flex; align-items: flex-start; gap: 10px; padding: 9px 11px; cursor: pointer; }
.srv-head input[type="checkbox"] { margin: 2px 0 0; accent-color: var(--red); width: 15px; height: 15px; flex: none; }
.srv-t { flex: 1 1 auto; min-width: 0; font-size: 14px; line-height: 1.35; }
.srv-n { display: block; font-size: 11.5px; line-height: 1.35; color: var(--grey); margin-top: 3px; }
.setup { flex: none; background: none; border: 0; padding: 0 0 0 8px; cursor: pointer; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--grey); }
.setup:hover { color: var(--red); }
.setup.open { color: var(--red); }
.srv-body { border-top: 1px solid var(--line); padding: 12px 11px 14px; background: var(--field); }
.srv-body[hidden] { display: none; }

.opt { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.opt:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.opt-head { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; }
.opt-head input[type="checkbox"] { margin: 2px 0 0; accent-color: var(--red); width: 14px; height: 14px; flex: none; }
.opt-t { flex: 1 1 auto; min-width: 0; font-size: 13.5px; font-weight: 600; color: var(--ink); line-height: 1.35; }
.price-wrap { flex: none; display: flex; align-items: center; gap: 4px; }
.price { width: 86px; background: var(--bg); border: 1px solid var(--line); padding: 4px 7px; font-size: 13px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.price:focus { border-color: var(--ink); outline: none; }
.cur { font-size: 12px; color: var(--grey); }
.opt-d { font-size: 12.5px; line-height: 1.45; color: var(--grey); margin-top: 5px; padding-left: 23px; }
.opt-d.hidden { display: none; }

.foot { flex: none; border-top: 1px solid var(--line); padding: 14px 24px 18px; background: var(--bg); }
.btns { display: flex; gap: 8px; }
.btn { flex: 1 1 auto; white-space: nowrap; padding: 10px 8px; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); font-size: 13px; font-weight: 700; cursor: pointer; }
.btn:hover { border-color: var(--red); color: var(--red); }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
.foot .linkbtn { margin-top: 10px; }
.hint { font-size: 12px; color: var(--grey); margin-top: 8px; }

/* история */
.hist { border-top: 1px solid var(--line); padding: 12px 0; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; align-items: start; }
.hist:first-of-type { border-top: 0; }
.hist-t { font-weight: 700; color: var(--ink); font-size: 14px; }
.hist-m { font-size: 12.5px; color: var(--grey); }
.hist-sum { font-weight: 800; color: var(--red); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hist-acts { grid-column: 1 / -1; display: flex; gap: 14px; margin-top: 4px; }
.empty { color: var(--grey); font-size: 13.5px; padding-top: 4px; }

/* ——— превью ——— */
.main { overflow-y: auto; min-height: 0; padding: 28px 0 56px; }
.stage { zoom: var(--zoom, 1); display: flex; flex-direction: column; align-items: center; gap: 24px; }
.sheet {
  width: 210mm; min-height: 297mm; background: var(--bg); color: var(--text);
  padding: 18mm 16mm 16mm; position: relative; display: flex; flex-direction: column;
  box-shadow: 0 1px 3px rgba(0,0,0,.14), 0 10px 28px rgba(0,0,0,.08);
}
.sheet-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--grey); padding-bottom: 7mm; }
.sheet-foot { margin-top: auto; padding-top: 8mm; display: flex; justify-content: space-between; align-items: baseline; font-size: 10px; letter-spacing: 0.1em; color: var(--grey); }
.sheet p, .sheet li { text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
.sheet .left, .sheet .t, .sheet .m, .sheet .kicker, .sheet h1, .sheet h2, .sheet h3 { text-align: left; }

.sheet h1 { font-weight: 800; font-size: 58px; line-height: 0.95; letter-spacing: -0.03em; color: var(--ink); }
.sheet h2 { font-weight: 700; font-size: 26px; line-height: 1.2; color: var(--ink); padding-bottom: 9px; border-bottom: 1.5px solid var(--rule); text-wrap: balance; }
.sheet h3 { font-weight: 700; font-size: 17px; line-height: 1.3; color: var(--ink); padding: 22px 0 8px; border-bottom: 1px solid var(--rule); }
.kicker { color: var(--red); font-weight: 700; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 12px; }
.lede { color: var(--grey); font-size: 14px; line-height: 1.55; }
.body-txt { font-size: 14px; line-height: 1.55; }

.cover-top { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 32px; align-items: end; padding-top: 34mm; padding-bottom: 14mm; }
.cover-role { color: var(--red); font-weight: 700; font-size: 15px; line-height: 1.35; padding-bottom: 6px; }
.toc-title { display: flex; align-items: center; gap: 10px; margin-top: 18mm; font-weight: 700; font-size: 17px; color: var(--ink); padding-bottom: 9px; border-bottom: 1.5px solid var(--rule); }
.toc-title::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--red); flex: none; }
.toc { list-style: none; column-count: 2; column-gap: 28px; padding-top: 11px; }
.toc li { font-size: 13.5px; line-height: 1.6; color: var(--text); break-inside: avoid; }
.toc li span { color: var(--grey); margin-right: 8px; font-variant-numeric: tabular-nums; }
.cover-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px 12px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
.cf-note { color: var(--grey); font-size: 13px; }
.cf-arrow svg { width: 30px; height: 9px; fill: none; stroke: var(--red); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; display: block; }
.cf-link { font-weight: 700; font-size: 13px; color: var(--ink); }

.entry { display: grid; grid-template-columns: 150px minmax(0, 1fr); column-gap: 32px; padding: 14px 0; border-top: 1px solid var(--line); }
h2 + .entry, h3 + .entry { border-top: 0; }
.entry .t { font-weight: 700; color: var(--ink); font-size: 14px; line-height: 1.4; }
.entry .m { color: var(--grey); font-size: 12.5px; line-height: 1.45; margin-top: 2px; }
.entry .m.red { color: var(--red); }
.entry .body > * + * { margin-top: 10px; }

ul.circ { list-style: none; }
ul.circ > li { position: relative; padding-left: 20px; font-size: 14px; }
ul.circ > li + li { margin-top: 7px; }
ul.circ > li::before { content: ""; position: absolute; left: 1px; top: 0.6em; width: 6px; height: 6px; border: 1.5px solid var(--grey); border-radius: 50%; }
ol.steps { list-style: none; counter-reset: s; }
ol.steps > li { counter-increment: s; position: relative; padding-left: 26px; font-size: 14px; }
ol.steps > li + li { margin-top: 9px; }
ol.steps > li::before { content: counter(s); position: absolute; left: 0; top: 0; font-weight: 800; color: var(--red); }

table.rates { width: 100%; border-collapse: collapse; margin-top: 4px; }
table.rates th { font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--grey); text-align: left; padding: 10px 0 8px; border-bottom: 1.5px solid var(--rule); }
table.rates th.num { text-align: right; }
table.rates td { padding: 11px 0; border-top: 1px solid var(--line); vertical-align: top; }
table.rates tr:first-child td { border-top: 0; }
table.rates .nm { font-weight: 700; color: var(--ink); font-size: 14px; line-height: 1.35; }
table.rates .ds { color: var(--grey); font-size: 12.5px; line-height: 1.45; margin-top: 3px; text-align: left; }
table.rates td.num { text-align: right; white-space: nowrap; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; padding-left: 20px; font-size: 14px; }
table.rates tr.sum td { border-top: 1.5px solid var(--rule); font-weight: 800; }
table.rates tr.sum td.num { color: var(--red); }

.tariffs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-top: 18px; border-top: 1.5px solid var(--rule); }
.tariff { padding: 16px 16px 18px; border-right: 1px solid var(--line); }
.tariff:last-child { border-right: 0; }
.tariff.rec { background: var(--panel); }
.tariff .rk { color: var(--red); font-weight: 700; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; min-height: 14px; }
.tariff .nm { font-weight: 700; color: var(--ink); font-size: 15px; margin-top: 6px; }
.tariff .pr { font-weight: 800; font-size: 26px; line-height: 1.1; letter-spacing: -0.02em; color: var(--ink); margin-top: 6px; font-variant-numeric: tabular-nums; }
.tariff.rec .pr { color: var(--red); }
.tariff .mo { font-size: 11.5px; color: var(--grey); }
.tariff .ds { font-size: 12.5px; color: var(--text); margin-top: 9px; text-align: left; line-height: 1.45; }

.panel { background: var(--panel); padding: 14px 16px; }
.panel .pl { display: block; font-size: 11.5px; color: var(--grey); margin-bottom: 4px; letter-spacing: 0.08em; text-transform: uppercase; }
.price-big { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; }
.price-big .old { font-size: 20px; font-weight: 700; color: var(--grey); text-decoration: line-through; text-decoration-thickness: 2px; }
.price-big .new { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: var(--red); font-variant-numeric: tabular-nums; }
.note { color: var(--grey); font-size: 13px; margin-top: 10px; }
.offer-rule { border-top: 3px solid var(--ink); padding-top: 20px; }
.contacts { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 5px 14px; }
.contacts dt { color: var(--grey); font-size: 13px; }
.contacts dd { margin: 0; font-weight: 700; color: var(--ink); font-size: 14px; overflow-wrap: anywhere; }
.ct-dot { display: flex; align-items: center; gap: 9px; }
.ct-dot::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--red); flex: none; }

/* тост */
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 13.5px; font-weight: 600; padding: 10px 18px; z-index: 50; }
.toast[hidden] { display: none; }

@media (max-width: 1100px) {
  :root { --aside: 330px; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .aside { border-right: 0; border-bottom: 1px solid var(--line); }
  .pane { overflow: visible; }
  body { height: auto; }
  .main { padding: 20px 12px 40px; }
}

@media print {
  @page { size: A4; margin: 0; }
  body { background: #fff; height: auto; }
  .app { display: block; height: auto; }
  .aside, .toast { display: none !important; }
  .main { overflow: visible; padding: 0; }
  .stage { zoom: 1; display: block; gap: 0; }
  .sheet { box-shadow: none; width: 210mm; min-height: 297mm; break-after: page; display: block; }
  .sheet:last-child { break-after: auto; }
  .sheet-foot { position: absolute; left: 16mm; right: 16mm; bottom: 12mm; margin-top: 0; }
  .cover-foot { position: absolute; left: 16mm; right: 16mm; bottom: 22mm; margin-top: 0; }
  .panel, .tariff.rec, .kicker, .price-big .new, table.rates tr.sum td.num, .toc-title::before, .ct-dot::before, .cf-arrow svg { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .entry, .tariff, .panel, table.rates tr { break-inside: avoid; }
  h2, h3 { break-after: avoid; }
}
</style>
</head>
<body>

<div class="app">

  <aside class="aside">
    <div class="brand">
      <p class="brand-name">Яна Горкунова</p>
      <p class="brand-sub">Конструктор КП</p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" id="tab-build" type="button" role="tab" aria-selected="true" aria-controls="pane-build">Собрать КП</button>
      <button class="tab" id="tab-hist" type="button" role="tab" aria-selected="false" aria-controls="pane-hist">История</button>
    </div>

    <div class="pane" id="pane-build" role="tabpanel" aria-labelledby="tab-build">

      <div class="group">
        <p class="group-title">Клиент и условия</p>
        <div class="field">
          <label for="f-client">Кому адресовано</label>
          <input class="inp" id="f-client" type="text" placeholder="Онлайн-школа «Название»">
        </div>
        <div class="field">
          <label for="f-topic">Тема предложения</label>
          <input class="inp" id="f-topic" type="text" placeholder="Юридическая упаковка онлайн-школы">
        </div>
        <div class="field row2">
          <div>
            <label for="f-date">Дата</label>
            <input class="inp" id="f-date" type="date">
          </div>
          <div>
            <label for="f-valid">Действует, дней</label>
            <input class="inp" id="f-valid" type="number" min="0" max="365" value="14">
          </div>
        </div>
        <div class="field row2">
          <div>
            <label for="f-disc">Скидка, %</label>
            <input class="inp" id="f-disc" type="number" min="0" max="90" value="0">
          </div>
          <div>
            <label for="f-term">Срок работы</label>
            <input class="inp" id="f-term" type="text" value="7–10 рабочих дней">
          </div>
        </div>
      </div>

      <div class="group">
        <p class="group-title">Персональная приписка</p>
        <div class="field">
          <textarea class="ta" id="f-note" placeholder="Пара строк лично для клиента — попадут на обложку КП."></textarea>
          <button class="linkbtn" id="btn-tpl-save" type="button">Сохранить как шаблон</button>
        </div>
        <div class="field" id="tpl-field" hidden>
          <label for="f-tpl">Мои шаблоны</label>
          <select class="sel" id="f-tpl"><option value="">— выбрать —</option></select>
        </div>
      </div>

      <div class="group">
        <p class="group-title">Дополнительные страницы</p>
        <div id="pages"></div>
      </div>

      <div class="group">
        <p class="group-title">Услуги</p>
        <div id="services"></div>
      </div>

    </div>

    <div class="pane" id="pane-hist" role="tabpanel" aria-labelledby="tab-hist" hidden>
      <div id="hist-list"></div>
    </div>

    <div class="foot">
      <div class="btns">
        <button class="btn primary" id="btn-pdf" type="button">Скачать PDF</button>
        <button class="btn" id="btn-word" type="button">Скачать Word</button>
        <button class="btn" id="btn-save" type="button">Сохранить</button>
      </div>
      <button class="linkbtn" id="btn-new" type="button">Начать новое КП</button>
      <p class="hint" id="total-hint">Выбрано услуг: 0 · 0&nbsp;₽</p>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="stage" id="stage"></div>
  </main>

</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ========== Каталог услуг ========== */
  var CATALOG = [
    {
      id: 'site',
      title: 'Документы для сайта',
      lead: 'Базовый комплект: без него нельзя принимать оплату, собирать заявки и запускать рекламу.',
      items: [
        { id: 'oferta', t: 'Оферта', p: 25000, d: 'Главный договор с клиентом. Фиксирует, что вы продаёте, на каких условиях, в какие сроки и в какой момент услуга считается оказанной. Без оферты клиент может вернуть деньги почти всегда и почти за всё.' },
        { id: 'pdn', t: 'Политика обработки персональных данных и согласие', p: 10000, d: 'Обязательны для любого сайта, где есть форма обратной связи, оплата или личный кабинет. Это первое, что смотрит Роскомнадзор при проверке.' },
        { id: 'rkn', t: 'Уведомление в реестр операторов Роскомнадзора', p: 15000, d: 'Подаётся до начала обработки персональных данных. Подготовлю текст уведомления и подам его за вас.' },
        { id: 'cookies', t: 'Согласие на обработку cookies', p: 7000, d: 'Нужно всем, у кого на сайте стоят Яндекс.Метрика, Google Analytics или пиксели рекламных кабинетов.' },
        { id: 'mail', t: 'Согласие на рекламную рассылку', p: 5000, d: 'Без него рассылка считается спамом: штраф до 500 000 ₽ за одно обращение в ФАС.' },
        { id: 'otz', t: 'Согласие на публикацию отзывов', p: 5000, d: 'Позволяет законно показывать имена, фотографии и результаты учеников на сайте и в соцсетях.' },
        { id: 'user', t: 'Пользовательское соглашение', p: 20000, d: 'Нужно, если у вас есть личный кабинет или платформа. Определяет правила пользования сервисом и ваши основания для блокировки.' }
      ]
    },
    {

  function save(key, value) {

  function today() {
    var d = new Date();

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function merge(base, saved) {
    if (!saved) return base;
    var out = base;
    ['client', 'topic', 'date', 'term', 'note', 'rec'].forEach(function (k) {
      if (typeof saved[k] === 'string') out[k] = saved[k];
    });
    ['valid', 'disc'].forEach(function (k) {
      if (typeof saved[k] === 'number') out[k] = saved[k];
    });
    if (saved.pages) Object.keys(out.pages).forEach(function (k) {
      if (typeof saved.pages[k] === 'boolean') out.pages[k] = saved.pages[k];
    });
    if (saved.srvNote) Object.keys(out.srvNote).forEach(function (k) {
      if (typeof saved.srvNote[k] === 'string') out.srvNote[k] = saved.srvNote[k];
    });
    if (saved.services) Object.keys(out.services).forEach(function (sid) {
      var s = saved.services[sid];
      if (!s) return;
      if (typeof s.on === 'boolean') out.services[sid].on = s.on;
      if (s.items) Object.keys(out.services[sid].items).forEach(function (iid) {
        if (typeof s.items[iid] === 'boolean') out.services[sid].items[iid] = s.items[iid];
      });
      if (s.price) Object.keys(out.services[sid].price).forEach(function (iid) {
        if (typeof s.price[iid] === 'number') out.services[sid].price[iid] = s.price[iid];
      });
    });
    return out;
  }

  /* ========== Утилиты ========== */
  function money(n) {
    return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function lines(s) {
    return esc(s).split(/\n+/).filter(Boolean).map(function (p) { return '<p>' + p + '</p>'; }).join('');
  }
  function ruDate(iso) {
    var M = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    var p = String(iso || '').split('-');
    if (p.length !== 3) return '';
    return Number(p[2]) + ' ' + M[Number(p[1]) - 1] + ' ' + p[0] + ' года';
  }
  function plusDays(iso, days) {
    var p = String(iso || '').split('-');
    if (p.length !== 3) return '';
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    d.setDate(d.getDate() + (Number(days) || 0));
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function $(sel) { return document.querySelector(sel); }

  /* ========== Расчёты ========== */
  function chosenServices() {
    return CATALOG.filter(function (s) {
      var st = state.services[s.id];
      if (!st.on) return false;
      return s.items.some(function (it) { return st.items[it.id]; });
    });
  }
  function chosenItems(s) {
    var st = state.services[s.id];
    return s.items.filter(function (it) { return st.items[it.id]; });
  }
  function serviceSum(s) {
    if (s.kind === 'packages') return 0;
    var st = state.services[s.id];
    return chosenItems(s).reduce(function (a, it) { return a + (st.price[it.id] || 0); }, 0);
  }
  function totalSum() {
    return chosenServices().reduce(function (a, s) { return a + serviceSum(s); }, 0);
  }
  function discounted() {
    var t = totalSum();
    var d = Math.min(90, Math.max(0, Number(state.disc) || 0));
    return Math.round(t * (100 - d) / 100);
  }

  function buildSheets() {
    var parts = [];
    var toc = [];

    EXTRA_PAGES.forEach(function (p) {
      if (!state.pages[p.id]) return;
      var inner = p.id === 'about' ? aboutInner() : p.id === 'how' ? howInner() : p.id === 'trust' ? trustInner() : whyInner();
      parts.push(inner);
      toc.push(p.id === 'why' ? 'Почему это нельзя откладывать' : p.title);
    });

    chosenServices().forEach(function (s) {
      parts.push(serviceInner(s));
      toc.push(s.title);
    });

    if (chosenServices().length) {
      parts.push(totalInner());
      toc.push('Стоимость и сроки');
    }
    parts.push(contactsInner());
    toc.push('Как начать работу');

    var total = parts.length + 1;
    var html = coverSheet(toc);
    parts.forEach(function (inner, i) { html += sheet(inner, i + 2, total); });
    return html;
  }

  function renderPreview() {
    $('#stage').innerHTML = buildSheets();
    fit();

  function fit() {
    var main = $('#main');
    var w = main.clientWidth;
    var sheetPx = 210 / 25.4 * 96; // 210 мм при 96 dpi
    var z = Math.min(1, Math.max(0.3, (w - 56) / sheetPx));
    $('#stage').style.setProperty('--zoom', z.toFixed(3));
  }

  function bindFields() {
    var map = { 'f-client': 'client', 'f-topic': 'topic', 'f-date': 'date', 'f-term': 'term', 'f-note': 'note' };
    Object.keys(map).forEach(function (id) {
      var el = document.getElementById(id);
      el.value = state[map[id]] || '';
      el.addEventListener('input', function () {
        state[map[id]] = el.value;
        renderPreview(); save(KEY_STATE, state);
      });
    });
    ['f-valid', 'f-disc'].forEach(function (id) {
      var key = id === 'f-valid' ? 'valid' : 'disc';
      var el = document.getElementById(id);
      el.value = state[key];
      el.addEventListener('input', function () {
        state[key] = Number(el.value) || 0;
        renderPreview(); renderFooter(); save(KEY_STATE, state);
      });
    });
  }

  $('#pages').addEventListener('change', function (e) {
    var id = e.target.getAttribute('data-page');
    if (!id) return;
    state.pages[id] = e.target.checked;
    renderPages(); renderPreview(); save(KEY_STATE, state);
  });

  $('#services').addEventListener('click', function (e) {
    var b = e.target.closest('[data-setup]');
    if (!b) return;
    e.preventDefault();
    var id = b.getAttribute('data-setup');
    openSetup[id] = !openSetup[id];
    if (openSetup[id] && !state.services[id].on) {
      state.services[id].on = true;
      var s = CATALOG.filter(function (x) { return x.id === id; })[0];
      if (!chosenItems(s).length) s.items.forEach(function (it) { state.services[id].items[it.id] = true; });
    }
    renderAll();
  });

  $('#services').addEventListener('change', function (e) {
    var el = e.target;
    var sid = el.getAttribute('data-srv-on');
    if (sid) {
      state.services[sid].on = el.checked;
      var s = CATALOG.filter(function (x) { return x.id === sid; })[0];
      if (el.checked && !chosenItems(s).length) {
        s.items.forEach(function (it) { state.services[sid].items[it.id] = true; });
      }
      if (el.checked) openSetup[sid] = true;
      renderAll();
      return;
    }
    if (el.getAttribute('data-item')) {
      var s2 = el.getAttribute('data-srv');
      state.services[s2].items[el.getAttribute('data-item')] = el.checked;
      if (el.checked) state.services[s2].on = true;
      renderAll();
      return;
    }
    if (el.hasAttribute('data-rec')) {
      state.rec = el.value;

  $('#hist-list').addEventListener('click', function (e) {
    var open = e.target.getAttribute('data-open');
    var copy = e.target.getAttribute('data-copy');
    var del = e.target.getAttribute('data-del');
    if (open || copy) {
      var id = open || copy;
      var rec = history.filter(function (h) { return h.id === id; })[0];
      if (!rec) return;
      state = merge(blankState(), rec.state);

      bindFieldValues();
      showTab('build');
      renderAll();

      return;
    }
    if (del) {
      history = history.filter(function (h) { return h.id !== del; });
      if (currentId === del) currentId = null;
      save(KEY_HIST, history);
      renderHistory();
      toast('Удалено');

  function downloadWord() {
    var css = [
      'body{font-family:Arial,sans-serif;font-size:11pt;color:#262626;}',
      'h1{font-size:28pt;color:#141414;}h2{font-size:16pt;color:#141414;border-bottom:1.5pt solid #141414;padding-bottom:4pt;}',
      'h3{font-size:12pt;color:#141414;border-bottom:1pt solid #141414;padding-bottom:3pt;}',
      '.kicker{color:#e0261f;font-weight:bold;font-size:9pt;letter-spacing:1pt;}',
      '.lede,.m,.ds,.note,.mo,.cf-note,.contacts dt{color:#8c8c8c;font-size:10pt;}',
      'table{width:100%;border-collapse:collapse;}',
      'th{font-size:8.5pt;color:#8c8c8c;text-align:left;border-bottom:1.5pt solid #141414;padding:6pt 0;}',
      'th.num,td.num{text-align:right;}',
      'td{border-top:1pt solid #dcdcdc;padding:7pt 0;vertical-align:top;}',
      '.nm{font-weight:bold;color:#141414;margin:0;}',
      '.sum td{border-top:1.5pt solid #141414;font-weight:bold;}.sum td.num{color:#e0261f;}',
      '.t{font-weight:bold;color:#141414;margin:0;}',
      '.new{color:#e0261f;font-size:24pt;font-weight:bold;}',
      '.old{color:#8c8c8c;text-decoration:line-through;}',
      '.panel{background:#f4f4f4;padding:8pt 10pt;}',
      '.tariff{border:1pt solid #dcdcdc;padding:8pt;}',
      '.sheet{page-break-after:always;}',
      'p{margin:0 0 6pt;}'
    ].join('');

    var body = $('#stage').innerHTML
      .replace(/<svg[\s\S]*?<\/svg>/g, '')
      .replace(/ class="sheet-head"[\s\S]*?<\/div>/g, ' class="sheet-head"></div>');

    var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
      '<head><meta charset="utf-8"><title>Коммерческое предложение</title>' +
      '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->' +
      '<style>@page{size:A4;margin:18mm 16mm;}' + css + '</style></head><body>' + body + '</body></html>';

    var blob = new Blob(['﻿', html], { type: 'application/msword;charset=utf-8' });
    // имя файла только латиницей: Chromium отбрасывает кириллицу в blob-загрузках с file://
    var name = ('KP-' + (state.client ? translit(state.client) + '-' : '') + state.date + '.doc')
      .replace(/-+/g, '-');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast('Файл Word скачан');
  }

  function translit(str) {
    var M = { а:'a', б:'b', в:'v', г:'g', д:'d', е:'e', ё:'e', ж:'zh', з:'z', и:'i', й:'y',
      к:'k', л:'l', м:'m', н:'n', о:'o', п:'p', р:'r', с:'s', т:'t', у:'u', ф:'f', х:'h',
      ц:'c', ч:'ch', ш:'sh', щ:'sch', ъ:'', ы:'y', ь:'', э:'e', ю:'yu', я:'ya' };
    return String(str).toLowerCase().split('').map(function (ch) {
      if (M[ch] !== undefined) return M[ch];
      return /[a-z0-9]/.test(ch) ? ch : '-';
    }).join('').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
  }

  window.addEventListener('resize', fit);

  /* ========== Старт ========== */
  if (!state.date) state.date = today();
  bindFields();
  bindFieldValues();
  renderTemplates();
  renderHistory();
  // на старте показываю заполненный пример, если ничего не выбрано
  if (!chosenServices().length) {
    state.services.site.on = true;
    ['oferta', 'pdn', 'rkn', 'cookies'].forEach(function (id) { state.services.site.items[id] = true; });
    openSetup.site = true;
  }
  renderAll();
})();
</script>

</body>
</html>
